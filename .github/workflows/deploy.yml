name: Deploy Veil to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: veil-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Resolve account and prepare first deployment
        env:
          CF_CREDENTIAL: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VEIL_MAIL_DOMAINS: ${{ vars.VEIL_MAIL_DOMAINS }}
          VEIL_ADMIN_PASSWORD: ${{ secrets.VEIL_ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync, mkdtempSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const raw = process.env.CF_CREDENTIAL.trim();
          const token = /^[A-Za-z0-9_-]{35,128}$/.test(raw) ? raw :
            raw.match(/\bAuthorization\s*:\s*Bearer\s+([A-Za-z0-9_-]{35,128})(?=["'\s]|$)/i)?.[1] ??
            raw.match(/(?:^|\n)\s*(?:export\s+)?CLOUDFLARE_API_TOKEN\s*=\s*["']?([A-Za-z0-9_-]{35,128})(?=["'\s]|$)/)?.[1];
          if (!token) throw new Error('Cloudflare API token missing or invalid');
          console.log(`::add-mask::${token}`);

          async function api(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            if (!response.ok || !body.success) {
              throw new Error(`Cloudflare API failed (HTTP ${response.status}, codes: ${body.errors?.map(error => error.code).join(', ')})`);
            }
            return body.result;
          }

          let account = process.env.CF_ACCOUNT.trim() ||
            raw.match(/api\.cloudflare\.com\/client\/v4\/accounts\/([a-f0-9]{32})\/tokens\/verify\b/i)?.[1] ||
            raw.match(/(?:^|\n)\s*(?:export\s+)?CLOUDFLARE_ACCOUNT_ID\s*=\s*["']?([a-f0-9]{32})(?=["'\s]|$)/i)?.[1];
          if (!account) {
            const zones = await api('/zones?per_page=50');
            const accounts = new Set(zones.map(zone => zone.account.id));
            if (zones.length >= 50 || accounts.size !== 1) throw new Error('Set the CLOUDFLARE_ACCOUNT_ID secret');
            [account] = accounts;
          }
          if (!/^[a-f0-9]{32}$/i.test(account)) throw new Error('Invalid Cloudflare Account ID');
          console.log(`::add-mask::${account}`);
          const workers = await api(`/accounts/${account}/workers/scripts`);
          const environment = process.env.GITHUB_ENV;
          appendFileSync(environment, `CLOUDFLARE_API_TOKEN=${token}\nCLOUDFLARE_ACCOUNT_ID=${account}\n`);

          if (!workers.some(worker => worker.id === 'veil')) {
            const domains = [...new Set(process.env.VEIL_MAIL_DOMAINS.toLowerCase().split(',').map(domain => domain.trim()).filter(Boolean))];
            const validDomain = /^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;
            if (!domains.length || domains.some(domain => domain.length > 253 || !validDomain.test(domain))) {
              throw new Error('Set VEIL_MAIL_DOMAINS to comma-separated receiving domains');
            }
            if (!process.env.VEIL_ADMIN_PASSWORD) throw new Error('Set the VEIL_ADMIN_PASSWORD repository secret');
            const directory = mkdtempSync(join(process.env.RUNNER_TEMP, 'veil-secrets-'));
            const secretsFile = join(directory, 'secrets.json');
            writeFileSync(secretsFile, JSON.stringify({
              MAIL_DOMAIN: domains.join(','),
              ADMIN_PASSWORD: process.env.VEIL_ADMIN_PASSWORD,
              JWT_TOKEN: randomBytes(32).toString('hex'),
            }), { mode: 0o600 });
            appendFileSync(environment, `VEIL_SECRETS_FILE=${secretsFile}\n`);
          }
          NODE
      - name: Deploy Worker
        shell: bash
        run: |
          wrangler=(npx --yes wrangler@4.168.0)
          if [[ -n "${VEIL_SECRETS_FILE:-}" ]]; then
            trap 'rm -f "$VEIL_SECRETS_FILE"' EXIT
            "${wrangler[@]}" deploy --secrets-file "$VEIL_SECRETS_FILE"
          else
            "${wrangler[@]}" deploy
          fi
      - name: Verify deployed Worker
        run: |
          node --input-type=module <<'NODE'
          const { CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token } = process.env;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/subdomain`, {
            headers: { Authorization: `Bearer ${token}` },
            signal: AbortSignal.timeout(15000),
          });
          const { result } = await response.json();
          if (!response.ok || !/^[a-z0-9-]+$/.test(result?.subdomain ?? '')) throw new Error('Workers subdomain unavailable');
          const workerUrl = `https://veil.${result.subdomain}.workers.dev`;
          for (let attempt = 0; attempt < 8; attempt++) {
            const health = await fetch(`${workerUrl}/api/health`, { signal: AbortSignal.timeout(10000) })
              .then(async response => response.ok && await response.json()).catch(() => null);
            if (health?.ok && health.service === 'veil') {
              console.log(`Veil health check passed: ${workerUrl}/api/health`);
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          throw new Error(`Veil health check failed: ${workerUrl}/api/health`);
          NODE
