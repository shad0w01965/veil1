name: Configure Veil email routing
on:
  push:
    branches: [veil-cloudflare-preflight]
permissions: {}
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable and verify email routing
        env:
          CF_CREDENTIAL: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VEIL_MAIL_DOMAINS: ${{ vars.VEIL_MAIL_DOMAINS }}
        run: |
          node --input-type=module <<'NODE'
          import { resolveMx } from 'node:dns/promises';

          const raw = process.env.CF_CREDENTIAL.trim();
          const token = /^[A-Za-z0-9_-]{35,128}$/.test(raw) ? raw :
            raw.match(/\bAuthorization\s*:\s*Bearer\s+([A-Za-z0-9_-]{35,128})(?=["'\s]|$)/i)?.[1] ??
            raw.match(/(?:^|\n)\s*(?:export\s+)?CLOUDFLARE_API_TOKEN\s*=\s*["']?([A-Za-z0-9_-]{35,128})(?=["'\s]|$)/)?.[1];
          if (!token) throw new Error('Cloudflare API token missing or invalid');
          console.log(`::add-mask::${token}`);

          async function api(path, method = 'GET', data) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: data === undefined ? undefined : JSON.stringify(data),
              signal: AbortSignal.timeout(20000),
            });
            const body = await response.json();
            if (!response.ok || !body.success) {
              const codes = (body.errors ?? []).flatMap(error => [error.code, ...(error.error_chain ?? []).map(item => item.code)]);
              const detail = (body.errors ?? []).map(error => String(error.message ?? '').replace(/[a-f0-9]{32}/gi, '<id>')).join('; ');
              throw new Error(`${method} ${path.replace(/[a-f0-9]{32}/g, '<id>')} failed (HTTP ${response.status}, codes: ${codes.join(', ')}): ${detail}`);
            }
            return body.result;
          }

          let account = process.env.CF_ACCOUNT.trim() ||
            raw.match(/api\.cloudflare\.com\/client\/v4\/accounts\/([a-f0-9]{32})\/tokens\/verify\b/i)?.[1] ||
            raw.match(/(?:^|\n)\s*(?:export\s+)?CLOUDFLARE_ACCOUNT_ID\s*=\s*["']?([a-f0-9]{32})(?=["'\s]|$)/i)?.[1];
          if (account && !/^[a-f0-9]{32}$/i.test(account)) throw new Error('Invalid Cloudflare Account ID');
          const zones = await api(`/zones?per_page=50${account ? `&account.id=${account}` : ''}`);
          if (!account) {
            const accounts = new Set(zones.map(zone => zone.account.id));
            if (zones.length >= 50 || accounts.size !== 1) throw new Error('Set the CLOUDFLARE_ACCOUNT_ID secret');
            [account] = accounts;
          }
          console.log(`::add-mask::${account}`);
          const domains = process.env.VEIL_MAIL_DOMAINS.split(',').map(domain => domain.trim()).filter(Boolean);
          if (domains.length !== 2 || new Set(domains).size !== 2) throw new Error('Expected two distinct receiving domains');
          const selected = domains.map(domain => zones.find(zone => zone.name === domain && zone.status === 'active'));
          if (selected.some(zone => !zone)) throw new Error('Missing active Cloudflare zone');

          const { subdomain } = await api(`/accounts/${account}/workers/subdomain`);
          if (!/^[a-z0-9-]+$/.test(subdomain)) throw new Error('Invalid workers.dev subdomain');
          const healthResponse = await fetch(`https://veil.${subdomain}.workers.dev/api/health`, { signal: AbortSignal.timeout(15000) });
          const health = await healthResponse.json();
          if (!healthResponse.ok || !health.ok || health.service !== 'veil' ||
              domains.some(domain => !health.config?.domains?.includes(domain))) {
            throw new Error('Veil must be healthy with both receiving domains before routing is changed');
          }

          const targetsVeil = rule => rule.actions?.length === 1 && rule.actions[0].type === 'worker' && rule.actions[0].value?.[0] === 'veil';
          for (const zone of selected) {
            try {
              const path = `/zones/${zone.id}/email/routing`;
              const catchAllPath = `${path}/rules/catch_all`;
              const [settings, rule, mx] = await Promise.all([
                api(path), api(catchAllPath),
                resolveMx(zone.name).catch(error => {
                  if (error.code === 'ENODATA') return [];
                  throw error;
                }),
              ]);
              if (mx.some(record => !/^route[1-3]\.mx\.cloudflare\.net\.?$/i.test(record.exchange))) {
                throw new Error('Existing MX records point to another mail service');
              }
              if (rule.enabled && !targetsVeil(rule)) throw new Error('A different Catch-all rule is already enabled');
              if (!settings.enabled) await api(`${path}/dns`, 'POST');
              if (!rule.enabled) {
                await api(catchAllPath, 'PUT', {
                  name: 'Veil', enabled: true, matchers: [{ type: 'all' }],
                  actions: [{ type: 'worker', value: ['veil'] }],
                });
              }
              const [currentRouting, currentRule] = await Promise.all([api(path), api(catchAllPath)]);
              if (!currentRouting.enabled || !currentRule.enabled || !targetsVeil(currentRule)) throw new Error('Saved routing configuration did not verify');
              console.log(`${zone.name} Email Routing enabled, state ${currentRouting.status}, Catch-all routed to veil`);
            } catch (error) {
              console.error(`${zone.name} ${error.message}`);
              process.exitCode = 1;
            }
          }
          NODE
